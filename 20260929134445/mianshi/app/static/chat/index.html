<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试陪练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #050b14; --card: rgba(12, 21, 36, .8); --line: #1c2a42;
    --txt: #e8eef7; --dim: #8ea0b8; --faint: #55677f; --lime: #c9f24e;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; color: var(--txt);
    background: var(--bg); overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(142, 160, 184, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(142, 160, 184, .045) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
  }
  /* ---------- 侧栏 ---------- */
  aside {
    width: 262px; flex-shrink: 0; display: flex; flex-direction: column;
    background: rgba(6, 12, 23, .85); border-right: 1px solid var(--line);
    position: relative; z-index: 2;
  }
  .side-top { padding: 18px 14px 10px; }
  .back {
    display: inline-block; color: var(--faint); text-decoration: none;
    font-size: 12px; letter-spacing: 1px; margin-bottom: 14px;
  }
  .back:hover { color: var(--lime); }
  .btn-new {
    width: 100%; padding: 12px; border: none; border-radius: 11px; cursor: pointer;
    background: var(--lime); color: #0b1220; font-size: 14px; font-weight: 800;
    letter-spacing: 1px; transition: filter .2s;
  }
  .btn-new:hover { filter: brightness(1.08); }
  .conv-list { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
  .conv-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13px;
    color: var(--dim); margin-bottom: 2px; border: 1px solid transparent;
  }
  .conv-item:hover { background: rgba(28, 42, 66, .5); color: var(--txt); }
  .conv-item.active {
    background: rgba(201, 242, 78, .09); border-color: rgba(201, 242, 78, .25); color: #d9f99d;
  }
  .conv-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .del {
    flex-shrink: 0; margin-left: 8px; color: var(--faint); font-size: 15px;
    visibility: hidden; padding: 0 4px;
  }
  .conv-item:hover .del { visibility: visible; }
  .conv-item .del:hover { color: #f87171; }
  /* ---------- 主区 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 1; }
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 26px; border-bottom: 1px solid var(--line);
    background: rgba(6, 12, 23, .5); backdrop-filter: blur(10px);
  }
  .toolbar .title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
  .toolbar .title i {
    width: 9px; height: 9px; border-radius: 50%; background: var(--lime);
    box-shadow: 0 0 8px rgba(201, 242, 78, .7);
  }
  select {
    padding: 9px 13px; border-radius: 10px; font-size: 13px;
    background: var(--card); color: var(--txt); border: 1px solid var(--line);
    outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--lime); }
  .kb {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--dim); cursor: pointer; user-select: none;
  }
  .kb input { accent-color: var(--lime); cursor: pointer; }
  .srcs {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
    padding-top: 10px; border-top: 1px dashed var(--line);
  }
  .src {
    font-size: 11px; color: var(--dim); background: rgba(201, 242, 78, .07);
    border: 1px solid rgba(201, 242, 78, .22); border-radius: 999px;
    padding: 3px 10px; max-width: 240px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  /* ---------- 消息区 ---------- */
  .msgs { flex: 1; overflow-y: auto; padding: 26px; }
  .msgs-inner { max-width: 780px; margin: 0 auto; }
  .empty { text-align: center; color: var(--faint); margin-top: 11vh; font-size: 13.5px; line-height: 2.1; }
  .empty .big { font-size: 42px; margin-bottom: 10px; }
  .empty b { color: var(--txt); font-size: 17px; letter-spacing: 1px; }
  .empty .hl { color: var(--lime); }
  .msg { margin-bottom: 24px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 13px 17px; border-radius: 15px; font-size: 14.5px; line-height: 1.75;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--lime); color: #101c0a; font-weight: 500; border-bottom-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px;
  }
  .bubble h3 { font-size: 15px; margin: 12px 0 6px; color: #d9f99d; }
  .bubble h3:first-child { margin-top: 0; }
  .bubble p { margin: 6px 0; }
  .bubble ul { margin: 6px 0 6px 18px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    background: rgba(2, 6, 23, .85); padding: 2px 6px; border-radius: 5px;
    font-size: 13px; font-family: Consolas, Monaco, monospace; color: #d9f99d;
  }
  .msg.user .bubble code { background: rgba(11, 18, 32, .15); color: #1a2e05; }
  .bubble pre {
    background: rgba(2, 6, 23, .92); border: 1px solid var(--line); border-radius: 11px;
    padding: 14px; overflow-x: auto; margin: 10px 0;
  }
  .bubble pre code { background: none; padding: 0; color: #a5f3fc; }
  .cursor {
    display: inline-block; width: 8px; height: 16px; background: var(--lime);
    vertical-align: text-bottom; animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* ---------- 输入区 ---------- */
  .input-bar { padding: 16px 26px 20px; }
  .input-inner {
    max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 10px;
    transition: border-color .2s;
  }
  .input-inner:focus-within { border-color: rgba(201, 242, 78, .6); }
  textarea {
    flex: 1; resize: none; border: none; background: none; outline: none;
    color: var(--txt); font-size: 14.5px; font-family: inherit; line-height: 1.6;
    max-height: 160px; padding: 6px 8px;
  }
  textarea::placeholder { color: var(--faint); }
  .send {
    flex-shrink: 0; padding: 10px 24px; border: none; border-radius: 11px; cursor: pointer;
    background: var(--lime); color: #0b1220; font-size: 14px; font-weight: 800;
    letter-spacing: 1px; transition: filter .2s;
  }
  .send:hover { filter: brightness(1.08); }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .tip {
    text-align: center; color: #3d4f66; font-size: 11px; margin-top: 10px;
    font-family: Consolas, monospace; letter-spacing: 2px;
  }
</style>
</head>
<body>
  <aside>
    <div class="side-top">
      <a class="back" href="/">← 返回平台</a>
      <button class="btn-new" onclick="newChat()">＋ 新对话</button>
    </div>
    <div class="conv-list" id="convList"></div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <div class="title"><i></i>AI 面试陪练</div>
      <label class="kb" title="回答时自动检索 content/ 目录下的个人题库资料">
        <input type="checkbox" id="kbChk" checked> 基于题库
      </label>
      <select id="modeSel" onchange="changeMode()">
        <option value="interviewer">模拟面试（AI 提问）</option>
        <option value="explain">讲解答疑（我问 AI）</option>
        <option value="free">自由问答</option>
      </select>
    </div>
    <div class="msgs" id="msgs">
      <div class="msgs-inner" id="msgList">
        <div class="empty">
          <div class="big">🤖</div>
          <b>AI INTERVIEW COACH</b><br>
          <span class="hl">「模拟面试」</span>：AI 面试官逐题提问、点评你的回答<br>
          <span class="hl">「讲解答疑」</span>：粘贴任何面试题，AI 深入讲解<br>
          <span class="hl">「自由问答」</span>：随便聊，和技术无关也行
        </div>
      </div>
    </div>
    <div class="input-bar">
      <div class="input-inner">
        <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="sendBtn" onclick="send()">发送</button>
      </div>
      <div class="tip">AI GENERATED · 仅供参考</div>
    </div>
  </div>

<script>
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const msgList = document.getElementById('msgList');
const msgs = document.getElementById('msgs');
const modeSel = document.getElementById('modeSel');
const kbChk = document.getElementById('kbChk');
let convId = null;
let sending = false;

modeSel.value = localStorage.getItem('chat_mode') || 'interviewer';
function changeMode() { localStorage.setItem('chat_mode', modeSel.value); }
kbChk.checked = localStorage.getItem('kb_on') !== '0';
kbChk.addEventListener('change', () => localStorage.setItem('kb_on', kbChk.checked ? '1' : '0'));

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
msgs.addEventListener('scroll', () => {});

/* ---------- 极简 Markdown 渲染 ---------- */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function md(src) {
  const blocks = [];
  src = src.replace(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g, (m, code) => {
    blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\x00' + (blocks.length - 1) + '\x00';
  });
  let html = '', inUl = false;
  for (let line of esc(src).split('\n')) {
    line = line.trim();
    const li = line.match(/^[-*]\s+(.*)/) || line.match(/^\d+[.、)]\s+(.*)/);
    if (li) {
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>' + inline(li[1]) + '</li>';
      continue;
    }
    if (inUl) { html += '</ul>'; inUl = false; }
    if (!line) continue;
    const h = line.match(/^#{1,4}\s+(.*)/);
    if (h) { html += '<h3>' + inline(h[1]) + '</h3>'; continue; }
    html += '<p>' + inline(line) + '</p>';
  }
  if (inUl) html += '</ul>';
  return html.replace(/\x00(\d+)\x00/g, (m, i) => blocks[+i]);
}

/* ---------- UI ---------- */
function clearEmpty() {
  const e = document.querySelector('.empty');
  if (e) e.remove();
}
function addMsg(role, html) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.innerHTML = '<div class="bubble">' + html + '</div>';
  msgList.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div.querySelector('.bubble');
}
function scrollBottom() { msgs.scrollTop = msgs.scrollHeight; }

function renderSources(arr) {
  if (!arr || !arr.length) return '';
  return '<div class="srcs">' + arr.map(s =>
    `<span class="src" title="${esc(s.source || '')}">📚 ${esc(s.title || s.source)}</span>`
  ).join('') + '</div>';
}

/* ---------- 会话历史 ---------- */
async function loadConversations() {
  const list = await (await fetch('/api/conversations')).json();
  document.getElementById('convList').innerHTML = list.map(c => `
    <div class="conv-item ${c.id === convId ? 'active' : ''}" onclick="openConv(${c.id})">
      <div class="t">${c.title}</div>
      <div class="del" onclick="delConv(event,${c.id})">×</div>
    </div>`).join('');
}
async function openConv(id) {
  if (sending) return;
  convId = id;
  const data = await (await fetch(`/api/conversations/${id}/messages`)).json();
  msgList.innerHTML = '';
  for (const m of data) {
    let srcs = [];
    try { srcs = m.sources ? JSON.parse(m.sources) : []; } catch {}
    const html = (m.role === 'user' ? esc(m.content) : md(m.content)) + renderSources(srcs);
    addMsg(m.role, html);
  }
  loadConversations();
}
async function delConv(e, id) {
  e.stopPropagation();
  if (!confirm('删除这个对话？')) return;
  await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
  if (convId === id) newChat();
  loadConversations();
}
function newChat() {
  if (sending) return;
  convId = null;
  msgList.innerHTML = `<div class="empty">
    <div class="big">🤖</div>
    <b>AI INTERVIEW COACH</b><br>
    <span class="hl">「模拟面试」</span>：AI 面试官逐题提问、点评你的回答<br>
    <span class="hl">「讲解答疑」</span>：粘贴任何面试题，AI 深入讲解<br>
    <span class="hl">「自由问答」</span>：随便聊，和技术无关也行</div>`;
  loadConversations();
}

/* ---------- 发送（SSE 流式） ---------- */
async function send() {
  const content = input.value.trim();
  if (!content || sending) return;
  sending = true;
  sendBtn.disabled = true;
  input.value = ''; input.style.height = 'auto';

  addMsg('user', esc(content));
  const aiBubble = addMsg('ai', '<span class="cursor"></span>');
  let aiText = '';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: convId, content, mode: modeSel.value, use_kb: kbChk.checked,
      }),
    });
    if (resp.status === 401) { location.href = '/login'; return; }
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      aiText = '⚠️ ' + (data.detail || '请求失败');
      aiBubble.innerHTML = aiText;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let pendingSources = [];
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!raw.startsWith('data:')) continue;
        const payload = raw.slice(5).trim();
        if (payload === '[DONE]') continue;
        let data;
        try { data = JSON.parse(payload); } catch { continue; }
        if (data.conversation_id && !convId) convId = data.conversation_id;
        if (data.sources && data.sources.length) pendingSources = data.sources;
        if (data.content) {
          aiText += data.content;
          aiBubble.innerHTML = md(aiText) + '<span class="cursor"></span>';
          scrollBottom();
        }
        if (data.error) {
          aiText += '\n\n⚠️ ' + data.error;
          aiBubble.innerHTML = md(aiText);
        }
      }
    }
    aiBubble.innerHTML = md(aiText) + renderSources(pendingSources);
  } catch (e) {
    aiBubble.innerHTML = '⚠️ 连接中断：' + esc(String(e));
  } finally {
    sending = false;
    sendBtn.disabled = false;
    loadConversations();
  }
}

loadConversations();
</script>
</body>
</html>
