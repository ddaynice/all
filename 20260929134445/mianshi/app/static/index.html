<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 AI 平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #050b14;
    --card: rgba(12, 21, 36, .75);
    --line: #1c2a42;
    --txt: #e8eef7;
    --dim: #8ea0b8;
    --lime: #c9f24e;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; color: var(--txt); background: var(--bg);
    position: relative; overflow-x: hidden;
  }
  /* 隐约网格 + 顶部光晕 */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(142, 160, 184, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(142, 160, 184, .05) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 40% at 75% -5%, rgba(201, 242, 78, .07), transparent 70%),
      radial-gradient(ellipse 45% 35% at 15% 10%, rgba(34, 211, 238, .05), transparent 70%);
  }
  /* ---------- 悬浮胶囊导航 ---------- */
  nav {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10; width: min(880px, 92%);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(7, 14, 26, .78); backdrop-filter: blur(16px);
    border: 1px solid rgba(142, 160, 184, .16); border-radius: 999px;
    padding: 7px 8px 7px 8px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--lime); color: #0b1220;
    font-weight: 800; font-size: 13px; letter-spacing: 1px;
    padding: 9px 18px; border-radius: 999px;
  }
  .logo i {
    width: 14px; height: 14px; border-radius: 50%;
    background: #0b1220; display: inline-block;
  }
  nav .right { display: flex; align-items: center; gap: 4px; padding-right: 6px; }
  nav .link {
    color: var(--dim); text-decoration: none; font-size: 13px;
    padding: 8px 14px; border-radius: 999px; border: none; background: none; cursor: pointer;
  }
  nav .link:hover { color: var(--lime); }
  nav .cta {
    color: var(--txt); text-decoration: none; font-size: 13px;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(142, 160, 184, .3);
  }
  nav .cta:hover { border-color: var(--lime); color: var(--lime); }
  /* ---------- 主体 ---------- */
  main { max-width: 1080px; margin: 0 auto; padding: 150px 32px 90px; position: relative; z-index: 1; }
  .kicker {
    font-size: 12px; letter-spacing: 4px; color: var(--lime);
    font-weight: 700; margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(46px, 8.5vw, 92px); font-weight: 250;
    line-height: .98; letter-spacing: 1px; text-transform: uppercase;
  }
  h1 .arrow { color: var(--lime); font-weight: 300; }
  .sub { color: var(--dim); font-size: 15px; margin: 26px 0 60px; letter-spacing: .5px; }
  .sub b { color: var(--txt); font-weight: 500; }
  /* ---------- 工具卡片 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .tool {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px 26px 70px; overflow: hidden;
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .tool:hover {
    transform: translateY(-4px); border-color: rgba(201, 242, 78, .55);
    box-shadow: 0 18px 46px rgba(0, 0, 0, .45), 0 0 0 1px rgba(201, 242, 78, .12);
  }
  .tool .meta {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px;
  }
  .tool .num {
    font-family: Consolas, monospace; font-size: 11px; color: var(--lime);
    border: 1px solid rgba(201, 242, 78, .45); border-radius: 999px; padding: 3px 10px;
  }
  .tool .tag {
    font-family: Consolas, monospace; font-size: 10px; letter-spacing: 3px; color: #55677f;
  }
  .tool .name { font-size: 21px; font-weight: 600; margin-bottom: 10px; }
  .tool .name::after { content: ' ·'; color: var(--lime); }
  .tool .desc { font-size: 13px; color: var(--dim); line-height: 1.7; max-width: 82%; }
  /* 绿青渐变有机图形 */
  .tool .blob {
    position: absolute; right: -26px; bottom: -30px;
    width: 104px; height: 104px; opacity: .92;
    background: linear-gradient(135deg, #a3e635 10%, #22d3ee 90%);
    border-radius: 62% 38% 55% 45% / 48% 60% 40% 52%;
    transition: transform .3s;
  }
  .tool:nth-child(2n) .blob { border-radius: 40% 60% 45% 55% / 58% 42% 58% 42%; }
  .tool:hover .blob { transform: rotate(14deg) scale(1.06); }
  .warn {
    display: none; margin-bottom: 26px; padding: 13px 18px; border-radius: 12px;
    background: rgba(248, 113, 113, .07); border: 1px solid rgba(248, 113, 113, .3);
    color: #fca5a5; font-size: 13px;
  }
  .warn code { color: #fde68a; }
  footer {
    max-width: 1080px; margin: 0 auto; padding: 0 32px 44px;
    display: flex; justify-content: space-between; color: #55677f;
    font-family: Consolas, monospace; font-size: 10px; letter-spacing: 3px;
  }
</style>
</head>
<body>
  <nav>
    <div class="logo"><i></i>MY AI</div>
    <div class="right">
      <button class="link" onclick="logout()">退出</button>
      <a class="cta" href="/chat/">AI 陪练 ↗</a>
    </div>
  </nav>

  <main>
    <div class="kicker">PERSONAL AI WORKBENCH</div>
    <h1>MY AI<br>STATION <span class="arrow">↘</span></h1>
    <div class="sub"><b>我的 AI 工作台</b> · 一个入口，所有工具。新工具会自动出现在这里。</div>

    <div class="warn" id="warn">⚠️ 尚未配置 DeepSeek API Key：编辑 <code>app/.env</code> 填入 <code>DEEPSEEK_API_KEY</code> 后重启，AI 功能才可用（刷题不受影响）。</div>

    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <span>MY AI STATION</span>
    <span>BUILD WITH FASTAPI</span>
  </footer>

<script>
async function load() {
  const me = await (await fetch('/api/me')).json();
  if (!me.ai_configured) document.getElementById('warn').style.display = 'block';
  const tools = await (await fetch('/api/tools')).json();
  document.getElementById('grid').innerHTML = tools.map((t, i) => `
    <a class="tool" href="${t.url}">
      <div class="meta">
        <span class="num">${String(i + 1).padStart(2, '0')}</span>
        <span class="tag">TOOL</span>
      </div>
      <div class="name">${t.name}</div>
      <div class="desc">${t.desc}</div>
      <div class="blob"></div>
    </a>`).join('');
}
async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login';
}
load();
</script>
</body>
</html>
